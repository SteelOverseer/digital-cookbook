name: cookbook-api
services:
  postgres:
    image: postgres:latest
    ports:
      - '6500:5432'
    volumes:
      - postgres:/var/lib/postgresql
    env_file:
      - ./.env
  pgAdmin:
    image: dpage/pgadmin4
    env_file:
      - ./.env
    ports:
      - "5051:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres
volumes:
  postgres:
  pgadmin: